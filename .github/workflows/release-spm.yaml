name: Release SPM

# SwiftPM resolves bare semver tags, so a Swift package release is just the tag.
# This workflow is the gate that stops a broken tag from becoming a release.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Verify and release
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
      - name: Git - Checkout
        uses: actions/checkout@v7

      - name: Check formatting
        run: swift format lint --strict -r Sources Tests

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
