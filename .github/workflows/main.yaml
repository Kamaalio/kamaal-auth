name: CI

on:
  push:

env:
  PNPM_VERSION: 11.17.0

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: true

jobs:
  quality-node:
    name: Quality (node)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Git - Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Check quality
        run: just quality-node

  test-node:
    name: Test (node)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Git - Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Run tests
        run: just test-node

  quality-swift:
    name: Quality (swift)
    timeout-minutes: 10
    runs-on: macos-latest
    steps:
      - name: Git - Checkout
        uses: actions/checkout@v7

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Check quality
        run: just quality-swift

  test-swift:
    name: Test (swift)
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
      - name: Git - Checkout
        uses: actions/checkout@v7

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Run tests
        run: just test-swift
