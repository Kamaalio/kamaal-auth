name: CI

on:
  push:

env:
  PNPM_VERSION: 11.17.0

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: true

jobs:
  quality-node:
    name: Quality (node)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Git - Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Check quality
        run: just quality-node

  test-node:
    name: Test (node)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Git - Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Run tests
        run: just test-node

  quality-swift:
    name: Quality (swift)
    timeout-minutes: 10
    runs-on: xcode-27
    steps:
      - name: Git - Checkout
        uses: actions/checkout@v7

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check quality
        run: just quality-swift

  test-swift:
    name: Test (swift)
    timeout-minutes: 20
    runs-on: xcode-27
    steps:
      - name: Git - Checkout
        uses: actions/checkout@v7

      - name: Restore SwiftPM repositories
        uses: actions/cache@v5
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Show Xcode and simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Run tests
        run: just test-swift

      - name: Collect failed Swift snapshots
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/swift-snapshot-failures"
          find "$TMPDIR" -type f -path '*/AuthSignInScreen*SnapshotTests/*.png' \
            -exec cp -v {} "$RUNNER_TEMP/swift-snapshot-failures/" \;
          find "$HOME/Library/Developer/CoreSimulator/Devices" -type f \
            -path '*/data/tmp/AuthSignInScreen*SnapshotTests/*.png' \
            -exec cp -v {} "$RUNNER_TEMP/swift-snapshot-failures/" \;
          git ls-files --others --exclude-standard -z -- 'Tests/KamaalAuthUITests/__Snapshots__/**/*.png' \
            | xargs -0 -I {} cp -v {} "$RUNNER_TEMP/swift-snapshot-failures/"
          sw_vers -productVersion

      - name: Upload failed Swift snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-snapshot-failures
          path: ${{ runner.temp }}/swift-snapshot-failures
